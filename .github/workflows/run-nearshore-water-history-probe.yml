# PIERBITE | 2026-07-28 ~13:25 UTC | v1 | Phase 1.3c Step 1
#
# Runs the nearshore water history probe and COMMITS the resulting
# calibration CSV back into this repository.
#
# MANUAL ONLY. There is deliberately no schedule on this workflow.
# It is a one-off calibration run, not a recurring job. It must never
# compete with the hourly fetch_data.py workflow.
#
# This workflow does NOT touch fetch_data.py, data.json, or anything
# the live site reads. It only creates or updates one file:
#     calibration/nearshore_water_history_30d.csv
#
# Expected runtime: roughly 6 to 12 minutes.

name: Nearshore Water History Probe (calibration, manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the nearshore water history probe
        run: python nearshore-water-history-probe-2026-07-28-v1.py

      - name: Show what the probe produced
        run: |
          echo "--- calibration folder ---"
          ls -la calibration/
          echo ""
          echo "--- first 15 lines of the CSV ---"
          head -15 calibration/nearshore_water_history_30d.csv
          echo ""
          echo "--- row count (including header) ---"
          wc -l calibration/nearshore_water_history_30d.csv

      - name: Commit the calibration CSV back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calibration/nearshore_water_history_30d.csv
          if git diff --staged --quiet; then
            echo "No change to the CSV - nothing to commit."
          else
            git commit -m "Calibration: 30-day nearshore water history (Phase 1.3c Step 1)"
            git push
            echo "CSV committed and pushed."
          fi
