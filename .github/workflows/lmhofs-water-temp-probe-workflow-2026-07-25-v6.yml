# ==================================================================
# PierBite.com - LMHOFS Water Temperature Probe v6 (manual only)
# File: .github/workflows/lmhofs-water-temp-probe-workflow-2026-07-25-v6.yml
# Created: 2026-07-25 | v6
# ==================================================================
# This is a TEST runner, not part of the live site.
#
# No schedule, so it never runs on its own and never costs anything.
# It only runs when you click "Run workflow" yourself.
#
# It does not touch data.json and saves nothing back to the
# repository. It only prints a report you can read on screen.
#
# NOTE ON THE BUTTON NAME: the "name:" line below is what appears in
# the Actions sidebar. It says v6 on purpose, so it cannot be
# confused with the older "Water Temperature Model Check" entry from
# the abandoned v4 attempt.
# ==================================================================

name: LMHOFS Water Temp Probe v6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the water temperature probe
        run: python lmhofs-water-temp-probe-2026-07-25-v6.py
