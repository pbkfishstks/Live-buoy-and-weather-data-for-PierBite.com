# PIERBITE — LMHOFS WATER TEMPERATURE PROBE (workflow)
# Created: 2026-07-25 | v1 | Diagnostic only
#
# WHAT THIS DOES
#   Adds a button to the GitHub "Actions" tab that runs the probe
#   script and prints the results to the log.
#
# SAFETY
#   - It runs ONLY when a human presses the button (workflow_dispatch).
#     There is no schedule. It will never fire on its own.
#   - It has read-only permission and cannot write to the repository.
#   - It does not touch data.json, fetch_data.py, or the live site.
#   - If it fails, nothing on PierBite.com is affected.
#
# COST
#   Free. Public GitHub repositories get unlimited Actions minutes,
#   and this run takes well under a minute.

name: LMHOFS Water Temperature Probe (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Test whether NOAA nearshore model data is reachable
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the probe
        run: python lmhofs-water-temp-probe-2026-07-25-v1.py
