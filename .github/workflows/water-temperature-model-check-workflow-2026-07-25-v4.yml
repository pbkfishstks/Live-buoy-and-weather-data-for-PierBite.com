#
# It has NO schedule, so it never runs on its own and never costs
# anything. It only runs when you click "Run workflow" yourself.
#
# It does not touch data.json and it does not save anything back to
# the repository. It only prints a report you can read on screen.
# ==================================================================

name: Water Temperature Model Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the validation probe
        run: python water-temperature-model-check-2026-07-25-v4.py
