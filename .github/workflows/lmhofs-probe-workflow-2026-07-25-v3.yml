# PIERBITE — LMHOFS WATER TEMPERATURE PROBE (workflow)
# Updated: 2026-07-25 | v3 | Diagnostic only
#
# CHANGE FROM v2: points at the v3 probe script. v3 skips the slow
# 90,806-point download because those grid points are already known,
# so this run finishes in well under a minute.
#
# SAFETY — UNCHANGED
#   - Runs ONLY when a human presses the button. No schedule.
#   - Read-only permission. Cannot write to the repository.
#   - Does not touch data.json, fetch_data.py, or the live site.
#   - If it fails, nothing on PierBite.com is affected.
#
# COST
#   Free. Public repositories get unlimited Actions minutes.

name: LMHOFS Water Temperature Probe v3 (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Read the water temperature at each pier
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the probe
        run: python lmhofs-water-temp-probe-2026-07-25-v3.py
