# PIERBITE — LMHOFS WATER TEMPERATURE PROBE (workflow)
# Updated: 2026-07-25 | v2 | Diagnostic only
#
# CHANGE FROM v1: points at the v2 probe script, and allows a longer
# run because v2 also downloads the full model grid coordinate list
# (a one-time, slow step that v1 did not attempt).
#
# SAFETY — UNCHANGED
#   - Runs ONLY when a human presses the button. No schedule.
#   - Read-only permission. Cannot write to the repository.
#   - Does not touch data.json, fetch_data.py, or the live site.
#   - If it fails, nothing on PierBite.com is affected.
#
# COST
#   Free. Public repositories get unlimited Actions minutes.

name: LMHOFS Water Temperature Probe (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Find a model water temperature at each pier
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the probe
        run: python lmhofs-water-temp-probe-2026-07-25-v2.py
