# PierBite.com — LMHOFS Trend Signal & Noise Probe (manual, one-off)
# Generated: 2026-07-27, v4
# ==================================================================
# This file gives you a "Run workflow" button that runs
# lmhofs-trend-signal-noise-probe-2026-07-27-v4.py on demand.
#
# WHAT v4 ANSWERS that v3 could not:
#   v3 measured model jitter correctly for the first time (~1.90 F),
#   but all six piers came back positive and tightly grouped — a
#   SYSTEMATIC lake-wide offset, not random scatter. Systematic error
#   largely cancels in a subtraction, and the 72-hour trend IS a
#   subtraction, so 1.90 F probably overstates the real impact.
#   v4 reads 30 days of actual history to measure how big real 24h,
#   48h and 72h temperature changes are, repeats the jitter test on
#   several days to see if it's stable and which sign it takes, and
#   reports a signal-to-noise ratio. That settles BOTH the scoring
#   weight and the trend window with evidence instead of judgement.
#
# RUNTIME: this makes roughly 230 small requests with a polite delay
# between each, so expect a few minutes — longer than earlier probes.
# That is normal. It does NOT change anything in the repository; it
# only prints a report you read in the log.
#
# This file must be placed at exactly this path in the repository:
#   .github/workflows/lmhofs-trend-signal-noise-probe-2026-07-27-v4.yml
# (GitHub only looks for workflow files in that exact folder.)
# ==================================================================

name: LMHOFS Trend Signal and Noise Probe

on:
  workflow_dispatch:   # manual only — click "Run workflow" to use it

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the LMHOFS trend signal and noise probe
        run: python lmhofs-trend-signal-noise-probe-2026-07-27-v4.py
